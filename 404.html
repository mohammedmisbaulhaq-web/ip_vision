<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142420" />
    <title>404 — Signal Lost | ipVision</title>
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="error-page">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="ipVision home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M20 4.5v7.2M20 28.3v7.2M4.5 20h7.2M28.3 20h7.2" stroke="currentColor" stroke-width="1.6" />
              <circle cx="20" cy="20" r="14.2" stroke="currentColor" stroke-width="1.6" />
              <circle cx="20" cy="20" r="7.4" stroke="currentColor" stroke-width="1.6" />
              <circle cx="20" cy="20" r="2.4" fill="currentColor" />
              <path d="m20 20 8.1-8.1" stroke="currentColor" stroke-width="1.6" />
              <circle cx="28.2" cy="11.8" r="2.3" fill="#f26a4b" stroke="#f5f3eb" stroke-width="1.1" />
            </svg>
          </span>
          <span class="brand-wordmark"><span>ip</span><span class="brand-accent">Vision</span></span>
        </a>
      </header>

      <main class="error-container">
        <div class="error-card">
          <div class="eyebrow"><span class="eyebrow-dot"></span> ERROR 404 <span class="eyebrow-divider">/</span> COORDINATE UNRESOLVED</div>
          <h1 class="error-code">404</h1>
          <h2 class="error-title">Signal Lost in Transmission</h2>
          <p class="error-desc">The requested route does not exist or has been relocated. Check the address or return to the scanner desk.</p>
          <a class="scan-button" href="/" style="display:inline-flex; text-decoration:none; margin-top:20px;">
            <span>Return to Scanner</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </main>

      <footer class="site-footer">
        <a class="footer-brand" href="/">ipVision</a>
        <span>NETWORK INTELLIGENCE, WITHOUT THE STATIC.</span>
      </footer>
    </div>
  </body>
</html>
